services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: progressiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: progressiq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: progressiq-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://progressiq-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://progressiq-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://progressiq-api.onrender.com

databases:
  # 3. Managed PostgreSQL Database (Free Tier)
  - name: progressiq-db
    plan: free
    databaseName: progressiq
    user: progressiq
